openapi: 3.1.0
info:
    title: DataFarm SensorData API
    description: |4
        ## Welcome

        The DataFarm SensorData API provides our clients with access to their SensorData,
        Device Metadata, and Export Functionality.

        ### Authentication

        A Bearer token should first be obtained from the Login endpoint. All subsequent endpoints will require this for authentication.

        ### Content Types

        All endpoints support JSON by default. Selected endpoints also support CSV by
        setting request header:

        Accept: text/csv

        ### Contributing

        DataFarm welcomes external contribution to the API, through Open Source under the GPL-3.0 License. If you would like to contribute please visit the project's Github page to get started: www.github.com/datafarm-software/datafarm-api.
    version: "1"
paths:
    /alert:
        post:
            tags:
                - Post
            summary: Create an alert rule.
            description: Clients can use this route to setup a new sensordata check, which will alert them according to the provided AlertRule request body.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlertRule'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreatedRule'
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:
                                        type: string
                                        description: Name associated with error code.
                                required:
                                    - $schema
                                    - title
                                    - status
                                    - detail
                            example:
                                schema: http://localhost:3030/schemas/ErrorModel.json
                                title: Bad Request
                                status: 400
                                detail: Need 2 range values for range alert.
                "409":
                    description: Resource Conflict
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    alertId:
                                        type: string
                                        description: In the event of a conflict, the existing alertId will be returned.
                                        readOnly: true
                                    statusError:
                                        description: A breakdown of the error that occurred.
                                required:
                                    - statusError
                            example:
                                statuserror:
                                    type: ""
                                    title: Conflict
                                    status: 409
                                    detail: Alert with identical parameters already exists.
                                    instance: ""
                                    errors: []
                                alertid: alert1
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                properties:
                                    $schema:
                                        type: string
                                        description: Link to Object Model.
                                    detail:
                                        type: string
                                        description: Human Readable explanation of what went wrong.
                                    status:
                                        type: integer
                                        description: Http Status Code.
                                        format: int64
                                    title:

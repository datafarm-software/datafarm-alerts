            summary: Post an alert.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InfluxAlert'
                required: true
            responses:
                "204":
                    description: No Content
                default:
                    description: Error
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ErrorModel'
components:
    schemas:
        AlertRule:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/AlertRule.json
                    readOnly: true
                alertId:
                    type: string
                    description: Alert Id.
                alertLevel:
                    type: integer
                    description: Specify the alert level to notify. 1 = WARN, 2 = CRIT
                    format: int64
                    minimum: 1
                    maximum: 2
                alertType:
                    type: integer
                    description: Specify type of check to perform. 0 = Less Than, 1 = Greater Than, 2 = Range, 3 = Inactive Sensor Check.
                    format: int64
                    maximum: 3
                deviceId:
                    type: string
                    description: The device for which data should be checked.
                    pattern: ^[a-zA-Z0-9]+$
                duration:
                    type: string
                    description: A duration literal, specifying how often a check should occur.
                    pattern: ^[0-9]{1,2}[mhdw]$
                emailAddresses:
                    type: array
                    description: List of email addresses to notify in the event of the alert. If updated, new list will replace old one as an overwrite.
                    items:
                        type: string
                        format: email
                    minItems: 1
                linearCalibration:
                    description: If provided, the alert will scale the specified device's data accordingly. It is assumed that the AlertRule RangeValues are  already on the calibrated level.
                    $ref: '#/components/schemas/LinearCalibration'
                name:
                    type: string
                    description: The name of the alert. For easier recognition.
                    pattern: ^[a-zA-Z0-9:, ]+$
                queryField:
                    type: string
                    description: The field on the device, for which data should be checked.
                    pattern: ^[a-zA-Z0-9_]+$
                rangeValues:
                    type: array
                    description: One or two values, depending on whether the alertRange is a range or < >
                    items:
                        type: number
                        format: float
                    maxItems: 2
            required:
                - alertId
                - emailAddresses
                - rangeValues
                - name
                - duration
                - deviceId
                - queryField
                - alertType
                - alertLevel
        CreatedRule:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/CreatedRule.json
                    readOnly: true
                alertId:
                    type: string
                    description: Generated Alert Id.
                    readOnly: true
            required:
                - alertId
        Emails:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/Emails.json
                    readOnly: true
                emailAddresses:
                    type: array
                    description: List of user email addresses.
                    items:
                        type: string
                        format: email
            required:
                - emailAddresses
        ErrorDetail:
            type: object
            additionalProperties: false
            properties:
                location:
                    type: string
                    description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
                message:
                    type: string
                    description: Error message text
                value:
                    description: The value at the given location
        ErrorModel:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/ErrorModel.json
                    readOnly: true
                detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                    examples:
                        - Property foo is required but is missing.
                errors:
                    type: array
                    description: Optional list of individual error details
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                    format: uri
                    examples:
                        - https://example.com/error-log/abc123
                status:
                    type: integer
                    description: HTTP status code
                    format: int64
                    examples:
                        - 400
                title:
                    type: string
                    description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
                    examples:
                        - Bad Request
                type:
                    type: string
                    description: A URI reference to human-readable documentation for the error.
                    format: uri
                    default: about:blank
                    examples:
                        - https://example.com/errors/example
        InfluxAlert:
            type: object
            additionalProperties: true
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/InfluxAlert.json
                    readOnly: true
                _check_id:
                    type: string
                _level:
                    type: string
                _sensor_timestamp:
                    type: string
                    format: date-time
                _time:
                    type: string
                    format: date-time
                _value:
                    type: number
                    format: double
                deviceID:
                    type: string
                query_field:
                    type: string
            required:
                - _check_id
                - _level
                - _sensor_timestamp
                - _time
                - deviceID
                - query_field
        LinearCalibration:
            type: object
            additionalProperties: false
            properties:
                cal-max:
                    type: number
                    format: double
                cal-min:
                    type: number
                    format: double
                raw-max:
                    type: number
                    format: double
                raw-min:
                    type: number
                    format: double
        MutateAlertUsersResponse:
            type: object
            additionalProperties: false
            properties:
                $schema:
                    type: string
                    description: A URL to the JSON Schema for this object.
                    format: uri
                    examples:
                        - https://example.com/schemas/MutateAlertUsersResponse.json
                    readOnly: true
                alertId:
                    type: string
                emailAddresses:
                    type: array
                    items:
                        type: string
            required:
                - alertId
                - emailAddresses
    securitySchemes:
        basic:
            type: http
            name: Authorization
            in: header
            scheme: basic
            bearerFormat: Basic
        bearer:
            type: http
            name: Authorization
            in: header
            scheme: bearer
            bearerFormat: JWT

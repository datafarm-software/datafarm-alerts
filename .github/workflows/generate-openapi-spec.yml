name: "Generate OpenAPI Spec"
on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  generate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Generate new OpenAPI Spec document
        run: go run cmd/generate-openapi-spec/main.go --filename api/openapi.yaml

      - name: Add and Commit
        uses: EndBug/add-and-commit@v9
        with:
          add: "api/openapi.yaml"
          default_author: github_actions
          fetch: false
          message: "Update OpenAPI Spec"
          push: origin ${{ github.ref_name }}

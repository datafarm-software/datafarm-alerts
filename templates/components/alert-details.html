{{define "alert-details"}}
<p
  style="
    margin: 0 0 12px 0;
    font-size: 16px;
    line-height: 24px;
    font-family: Arial, sans-serif;
  "
>
  Alert details:
</p>
<ul
  style="
    margin: 0 0 12px 0;
    font-size: 16px;
    line-height: 24px;
    font-family: Arial, sans-serif;
  "
>
  <li>Name: {{.Name}}</li>
  <li>DeviceId: {{.DeviceId}}</li>
  <li>QueryField: {{.QueryField}}</li>
  <li>Duration: {{.Duration}}</li>
  <li>AlertLevel: {{alertLevelToString .AlertLevel}}</li>
  <li>AlertType: {{alertTypeToString .AlertType}}</li>
  <li>Condition: {{.Condition}}</li>
</ul>
{{end}}
